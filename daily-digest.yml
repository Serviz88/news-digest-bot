name: Ежедневный новостной дайджест

on:
  schedule:
    # 06:00 UTC = 09:00 МСК (у Москвы фиксированное смещение UTC+3, без перехода на летнее время)
    - cron: "0 6 * * *"
  workflow_dispatch: {}  # позволяет запустить вручную кнопкой "Run workflow" на GitHub

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run daily digest script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python news_daily.py
