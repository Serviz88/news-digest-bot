name: Ежедневный новостной дайджест

on:
  schedule:
    # 06:00 UTC = 09:00 МСК (у Москвы фиксированное смещение UTC+3, без перехода на летнее время)
    - cron: "0 6 * * *"
  workflow_dispatch:  # позволяет запустить вручную кнопкой "Run workflow" на GitHub
    inputs:
      preview:
        description: "Только картинку «Пульс дня» мне в личку (для проверки)"
        type: boolean
        default: false

# Разрешение записывать в репозиторий (нужно для шага "Не дать GitHub выключить бота")
permissions:
  contents: write

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow (для картинки «Пульс дня»)
        run: pip install --quiet pillow

      - name: Run daily digest script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Канал для дайджеста, например @my_channel (если не задан — дайджест идёт в личный чат)
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          # Подпись внизу поста в канале (необязательно)
          CHANNEL_FOOTER: ${{ secrets.CHANNEL_FOOTER }}
          PREVIEW: ${{ inputs.preview }}
        run: python news_daily.py

      # GitHub выключает расписание, если в репозитории 60 дней нет изменений.
      # Раз в неделю (по понедельникам) бот сам записывает дату в файл last_run.txt —
      # это считается изменением, и счётчик 60 дней сбрасывается.
      - name: Не дать GitHub выключить бота
        if: always()
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ ! -f last_run.txt ]; then
            date -u +"%Y-%m-%d %H:%M UTC" > last_run.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
            git add last_run.txt
            git commit -m "keepalive: $(date -u +%Y-%m-%d)" || echo "нечего сохранять"
            git push || echo "не удалось сохранить отметку"
          else
            echo "Сегодня не понедельник, отметку не пишем"
          fi
